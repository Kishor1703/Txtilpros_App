name: txtilpros_app
description: TXTILPROS Reporting & Sales Portal (Flutter port of the React web app)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  intl: ^0.19.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^8.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo..jpg

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
